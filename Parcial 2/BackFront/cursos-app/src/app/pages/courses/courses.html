<h2>Agregar curso</h2>
<app-course-from-template 
(saveCourse)="onSaveCourse($event)">
</app-course-from-template>
<h2>Lista de curso</h2>

<div *ngFor="let c of courses()"
    style="border: 1px solid #ccc; padding:  10px; margin-bottom: 10px;">
    <h3>{{c.name}}</h3>
    <p>Categoria: {{c.category}}</p>
    <p>Duracion: {{c.duration}}</p>
    <p>Mode: {{c.mode}}</p>

    <a [routerLink]="['/courses', c.id]">Ver detalle</a>

</div>

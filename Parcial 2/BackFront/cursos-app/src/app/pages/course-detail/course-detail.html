<div *ngIf="course; else noEncontrado"
style="border: 1px solid #999; padding: 16px;">
    <h2>{{course.name}}</h2>
    <p>ID: {{course.id}}</p>
    <p>Duracion: {{course.duration}}</p>
    <p>Categoria: {{course.category}}</p>
    <p>Description: {{course.description}}</p>

    <a routerLink="/courses">Volver a cursos</a> 

</div>

<ng-template #noEncontrado>
    <p>No se encontro el curso solicitado</p>
    <a routerLink="/courses">Volver a cursos</a>
</ng-template>

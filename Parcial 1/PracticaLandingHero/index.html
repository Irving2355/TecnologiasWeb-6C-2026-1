<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Landing Irving</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- nav.navbar.navbar-expand-lg.navbar-dark.bg-dark.sticky-top>div.container -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <!-- a.navbar-brand.fw-bold[href="#hero"]{WebCamp} -->
            <a href="#hero" class="navbar-brand fw-bold">WebCamp</a>

            <!-- button.navbar.toggler[type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"]>span.navbar-toggler-icon -->
            <button class="navbar toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>

            <!-- div#navMenu.collapse.navbar-collapse -->
            <div id="navMenu" class="collapse navbar-collapse">
                <!-- ul.navbar-nav.ms-auto.mb-2.mb-lg-0 -->
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <!-- li.nav-item*3>a.nav-link[href="#"]{Link $} -->
                    <li class="nav-item"><a href="#" class="nav-link">Link 1</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Link 2</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Link 3</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- section#hero.hero.text-white>div.container -->
    <section id="hero" class="hero text-white">
        <div class="container"> 
            <!-- div.row.align-items-center.g-4.py-5 -->
            <div class="row align-items-center g-4 py-5">
                <!-- div.col-12.col-md-6 -->
                <div class="col-12 col-md-6">
                    <!-- h1.display-4.fw-bold{Aprende desarrollo Web} 
                    p.lead{Domina html,css,js y bootstrap con proyectos} -->
                    <h1 class="display-4 fw-bold">Aprende desarrollo Web</h1>
                    <p class="lead">Domina html,css,js y bootstrap con proyectos</p>

                    <!-- div.d-flex.gap-2.flex-wrap>a.btn.btn.light.btn-lg[href="#contacto"]{Inscribirme}+a.btn.btn.light.btn-lg[href="#producto"]{Productos} -->
                    <div class="d-flex gap-2 flex-wrap">
                        <a href="#contacto" class="btn btn light btn-lg">Inscribirme</a>
                        <a href="#producto" class="btn btn light btn-lg">Productos</a>
                    </div>
                </div>

                <!-- div.col-12.col-md-6.text-center -->
                <div class="col-12 col-md-6 text-center">
                    <!-- img.img-fluid.rounded.shadow-sm[src="https://picsum.photos/720/420"] -->
                    <img src="https://picsum.photos/720/420" alt="" class="img-fluid rounded shadow-sm">
                </div>
            </div>
        </div>
    </section>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS propio -->
    <script src="js/script.js"></script>
</body>
</html>
